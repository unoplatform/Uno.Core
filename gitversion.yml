# Major bumps are driven by a '+semver: major' directive in a commit message on
# master, not by next-version -- see 094419a, which removed next-version when the
# 4.0 line was cut.
assembly-versioning-scheme: MajorMinorPatch
mode: Mainline

branches:
  master:
    mode: ContinuousDeployment
    regex: master
    tag: dev
    increment: Minor
    is-source-branch-for: ['beta', 'stable']

  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    mode: ContinuousDeployment
    tag: 'PullRequest'
    tag-number-pattern: '[/-](?<number>\d+)[-/]'
    increment: Inherit

  # A servicing/* branch continues a previous version line after master has moved
  # on to a newer one, and publishes dev packages like master, hence the same 'dev'
  # tag. increment: Minor takes it one minor above the last stable tag and then
  # holds there, so only the build counter advances as fixes land.
  servicing:
    mode: ContinuousDeployment
    regex: ^servicing/.*
    tag: dev
    increment: Minor
    source-branches: ['master']

  beta:
    mode: ContinuousDeployment
    regex: ^release/beta/.*
    tag: beta
    increment: none
    source-branches: ['master']

  stable:
    regex: ^release/stable/.*
    tag: ''
    increment: Patch
    source-branches: ['master','beta']
    is-mainline: true

  dev:
    mode: ContinuousDeployment
    regex: ^dev/.*?/(.*?)
    tag: dev.{BranchName}
    source-branches: ['master', 'release', 'projects', 'feature']
    increment: none

  projects:
    tag: proj-{BranchName}
    regex: ^projects/(.*?)
    source-branches: ['master']
    increment: none

  feature:
    tag: feature.{BranchName}
    regex: ^feature/(.*?)
    source-branches: ['master']
    increment: none

ignore:
  sha: []
